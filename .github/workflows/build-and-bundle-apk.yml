name: Build and Bundle APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web bundle
        run: npm run build

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev || true
          npx cap add android || true
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Bundle APK into public/releases
        run: |
          mkdir -p public/releases
          APK=$(find android -name "*release*.apk" -o -name "*debug*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" public/releases/cardio-wave-v1.20.0-universal.apk
            echo "Bundled $APK"
          else
            echo "No APK found; keeping fallback artifact placeholder."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardio-wave-apk
          path: public/releases/cardio-wave-v1.20.0-universal.apk
          if-no-files-found: warn
